<html lang="en">
<head>

    <meta name="description" content="Full-service vacation rental property management for owners in Bradenton, Sarasota, Anna Maria Island, Siesta Key, and Longboat Key.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://seascape-vacations.com/property-management/">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://seascape-vacations.com/property-management/">
    <meta property="og:title" content="Vacation Rental Property Management | Seascape Vacations">
    <meta property="og:description" content="Full-service vacation rental property management for owners in Bradenton, Sarasota, Anna Maria Island, Siesta Key, and Longboat Key.">
    <meta property="og:image" content="https://seascape-vacations.com/hero-optimized.jpg">
    <meta property="og:locale" content="en_US">

    <!-- Twitter -->

    <meta name="twitter:title" content="Vacation Rental Property Management | Seascape Vacations">
    <meta name="twitter:description" content="Full-service vacation rental property management for owners in Bradenton, Sarasota, Anna Maria Island, Siesta Key, and Longboat Key.">
    <meta name="twitter:image" content="https://seascape-vacations.com/hero-optimized.jpg">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    
    
    <!-- Preserved Original Styles -->
    <style>
        :root {
            --brand: #5F8A8B;
            --brand-light: #7BA3A4;
            --brand-dark: #3D5C5D;
            --brand-darker: #2D4647;
            --gold: #C9A962;
            --gold-light: #E8D5A3;
            --cream: #F5EED6;
            --cream-dark: #EBE4CC;
            --cream-light: #FAF7EE;
            --stone: #3A3A3A;
            --stone-light: #6A6A6A;
            --white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', -apple-system, sans-serif;
            background: var(--cream);
            color: var(--stone);
            line-height: 1.7;
        }

        h1, h2, h3, h4 {
            font-family: 'Playfair Display', Georgia, serif;
            font-weight: 500;
            letter-spacing: -0.02em;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* Navigation - Same as main site */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(245, 238, 214, 0.98);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.08);
        }

        .nav-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .nav-logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 500;
            color: var(--brand);
            letter-spacing: 0.05em;
        }

        .nav-logo-sub {
            font-size: 9px;
            letter-spacing: 0.2em;
            color: var(--stone-light);
            text-transform: uppercase;
            margin-top: -2px;
        }

        /* Buttons */
        .btn {
            background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
            color: white;
            padding: 14px 32px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 14px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(61, 107, 109, 0.3);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(61, 107, 109, 0.4);
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--gold) 0%, #B8943A 100%);
            color: var(--stone);
            box-shadow: 0 4px 15px rgba(201, 169, 98, 0.3);
        }

        /* Main Content Area */
        .main-content {
            padding-top: 80px;
        }

        /* Section Styling */
        .section {
            padding: 80px 24px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 48px;
        }

        .section-tag {
            display: inline-block;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--brand);
            margin-bottom: 12px;
        }

        .section-title {
            font-size: clamp(28px, 4vw, 38px);
            color: var(--stone);
            margin-bottom: 12px;
        }

        .section-subtitle {
            color: var(--stone-light);
            max-width: 600px;
            margin: 0 auto;
        }

        /* Breadcrumbs */
        .breadcrumbs {
            background: white;
            padding: 12px 24px;
            border-bottom: 1px solid var(--cream-dark);
        }

        .breadcrumbs ol {
            display: flex;
            gap: 8px;
            list-style: none;
            margin: 0;
            padding: 0;
            font-size: 13px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .breadcrumbs a {
            color: var(--brand);
        }

        .breadcrumbs span {
            color: var(--stone-light);
        }

        /* Property Cards - Same as main site */
        .properties-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
        }

        .property-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease;
        }

        .property-card:hover {
            transform: translateY(-5px);
        }

        .property-img {
            height: 220px;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .property-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--gold);
            color: var(--stone);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .property-body {
            padding: 20px;
        }

        .property-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--stone);
            margin-bottom: 8px;
        }

        .property-meta {
            font-size: 13px;
            color: var(--stone-light);
            margin-bottom: 12px;
        }

        .property-price {
            font-size: 16px;
            color: var(--brand);
            font-weight: 600;
        }

        /* FAQ Section */
        .faq-section {
            background: var(--cream-dark);
        }

        .faq-item {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
        }

        .faq-question {
            font-size: 18px;
            font-weight: 600;
            color: var(--brand-dark);
            margin-bottom: 12px;
        }

        .faq-answer {
            color: var(--stone);
            line-height: 1.7;
        }

        /* CTA Section */
        .cta-section {
            background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
            padding: 80px 24px;
            text-align: center;
            color: white;
        }

        .cta-title {
            font-size: clamp(28px, 4vw, 40px);
            margin-bottom: 16px;
        }

        .cta-subtitle {
            opacity: 0.9;
            max-width: 500px;
            margin: 0 auto 32px;
        }

        /* Footer */
        .footer {
            background: var(--brand-darker);
            color: rgba(255, 255, 255, 0.8);
            padding: 60px 24px 30px;
        }

        .footer-inner {
            max-width: 1100px;
            margin: 0 auto;
            text-align: center;
        }

        .footer-logo {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: white;
            margin-bottom: 16px;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: white;
        }

        .footer-copyright {
            font-size: 13px;
            opacity: 0.6;
        }
    </style>
</head>
