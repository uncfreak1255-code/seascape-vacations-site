name: Release Safety

on:
  pull_request:
    branches:
      - main

concurrency:
  group: release-safety-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-safety:
    name: release-safety
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect dependency manifest changes
        id: dependency_changes
        shell: bash
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -Eq '^(package(-lock)?\.json)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run dependency audit gate
        if: steps.dependency_changes.outputs.changed == 'true'
        run: npm run audit:deps

      - name: Compute comparison range
        shell: bash
        run: |
          echo "RANGE=${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"

      - name: Run release safety gate
        run: npm run verify:release -- --range "$RANGE"
