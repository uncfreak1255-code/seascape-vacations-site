name: Release Safety

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  release-safety:
    name: release-safety
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute comparison range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "RANGE=origin/${{ github.base_ref }}...${{ github.sha }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "RANGE=HEAD^..HEAD" >> "$GITHUB_ENV"
          else
            echo "RANGE=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_ENV"
          fi

      - name: Run release safety gate
        run: npm run verify:release -- --range "$RANGE"
