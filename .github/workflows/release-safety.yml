name: Release Safety

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: release-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-safety:
    name: release-safety
    # This is a pure source/test gate. Hosted Linux keeps it out of the
    # screenshot runner's single-job queue for every PR and push.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute comparison range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "RANGE=${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "RANGE=HEAD^..HEAD" >> "$GITHUB_ENV"
          else
            echo "RANGE=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_ENV"
          fi

      - name: Detect dependency manifest changes
        id: dependency_changes
        shell: bash
        run: |
          changed_files="$(git diff --name-only "$RANGE")"
          if printf '%s\n' "$changed_files" | grep -Eq '^(package(-lock)?\.json|\.github/workflows/release-safety\.yml)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run dependency audit gate
        if: github.event_name == 'push' || steps.dependency_changes.outputs.changed == 'true'
        run: npm run audit:deps

      - name: Run release safety gate
        run: npm run verify:release -- --range "$RANGE"

      # A toolchain update can pass unit checks while a new axe or browser
      # exposes a real regression. Keep that proof in this required job.
      - name: Install locked Chromium for dependency proof
        if: steps.dependency_changes.outputs.changed == 'true'
        run: npx --no-install playwright install --with-deps chromium

      - name: Verify accessibility with updated dependencies
        if: steps.dependency_changes.outputs.changed == 'true'
        run: node scripts/enforcement/run-visual-tests.js tests/visual/accessibility.spec.js

  build:
    name: build
    needs: release-safety
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm authoritative gate passed
        run: |
          if [ "${{ needs.release-safety.result }}" != "success" ]; then
            echo "release-safety did not pass."
            exit 1
          fi
          echo "Build and tests passed in release-safety."
