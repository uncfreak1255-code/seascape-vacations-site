name: Playwright Visual Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "eleventy.config.js"
      - "playwright.config.js"
      - "tests/visual/**"
      - "scripts/enforcement/run-visual-tests.js"
      - "scripts/enforcement/capture-visual-proof.js"
      - "scripts/enforcement/serve-static.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/playwright-visual.yml"

concurrency:
  group: playwright-visual-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  visual-regression:
    # Only owner-authored PR commits triggered (or re-run) by Sawyer use the Mac.
    # Forks and other same-repository branch code stay on hosted macOS.
    runs-on: ${{ (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.author_association != 'OWNER' || github.actor != 'uncfreak1255' || github.triggering_actor != 'uncfreak1255') && 'macos-latest' || 'mac-sawbeck-seascape-vacations-site' }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci
      - run: npm run test:visual:install
      - run: npm run test:visual
      - run: npm run proof:visual
        if: always()

      - name: Upload visual proof bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-proof-bundle
          path: artifacts/visual-proof/
          retention-days: 7

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
