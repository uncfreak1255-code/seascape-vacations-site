name: Playwright Visual Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "eleventy.config.js"
      - "playwright.config.js"
      - "tests/visual/**"
      - "scripts/enforcement/run-visual-tests.js"
      - "scripts/enforcement/capture-visual-proof.js"
      - "scripts/enforcement/serve-static.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/playwright-visual.yml"

jobs:
  visual-regression:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci
      - run: npm run test:visual:install
      - run: npm run test:visual
      - run: npm run proof:visual
        if: always()

      - name: Upload visual proof bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-proof-bundle
          path: artifacts/visual-proof/

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
