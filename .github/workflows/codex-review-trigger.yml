name: Codex review trigger

# ---------------------------------------------------------------------------
# Asks the Codex GitHub connector for ONE review per pull request, at the
# moment the PR is ready — so review happens automatically, without an agent
# or Sawyer remembering to ask, and without spending Codex usage on every push.
#
# Rule:
#   - fires when a non-draft PR is opened, or a draft is marked ready;
#     never on later pushes (a re-review is requested by hand: "@codex review")
#   - skips PRs whose every changed file is prose, an image, a lockfile,
#     .gitignore, or the Hub knowledge-maintenance ledger
#   - skips PRs where someone already commented "@codex review"
#
# Why a personal token: the Codex connector only honours "@codex review" from
# an account linked to ChatGPT; a github-actions[bot] comment is ignored. The
# CODEX_REVIEW_TOKEN secret is a fine-grained token owned by Sawyer, limited to
# Pull requests: read/write on this repository.
# ---------------------------------------------------------------------------

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: codex-review-trigger-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  request-review:
    # Runs on Sawyer's own runner (hosted minutes are capped at $0), so only
    # same-repo, non-bot, non-draft PRs may execute here.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: [self-hosted, macOS, arm64]
    timeout-minutes: 5
    steps:
      - name: Request one Codex review if the rule says so
        uses: actions/github-script@v7
        env:
          CODEX_REVIEW_TOKEN: ${{ secrets.CODEX_REVIEW_TOKEN }}
        with:
          script: |
            // Files that never need a model review on their own: prose, images, lockfiles,
            // .gitignore, and the Hub's knowledge-maintenance ledger (edited with every doc change).
            const DOC_ONLY = /(\.(md|mdx|txt|png|jpe?g|gif|webp|svg|avif)$)|(^|\/)docs\/|(^|\/)(package-lock\.json|yarn\.lock|pnpm-lock\.yaml|poetry\.lock|uv\.lock|\.gitignore)$|^intelligence\/knowledge-maintenance\/lifecycle\.json$/i;
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;

            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number, per_page: 100 });
            if (files.length === 0) {
              core.setFailed('Pull request reports zero changed files; refusing to decide on an empty list.');
              return;
            }
            const reviewable = files.map(f => f.filename).filter(name => !DOC_ONLY.test(name));
            if (reviewable.length === 0) {
              core.notice(`Skipped: all ${files.length} changed files need no model review (prose, images, lockfiles, ledger).`);
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pull_number, per_page: 100 });
            if (comments.some(c => /@codex\s+review/i.test(c.body || ''))) {
              core.notice('Skipped: a Codex review was already requested on this PR.');
              return;
            }

            const token = process.env.CODEX_REVIEW_TOKEN;
            if (!token) {
              core.setFailed('CODEX_REVIEW_TOKEN secret is missing; cannot request the Codex review this PR needs.');
              return;
            }
            const asSawyer = github.getOctokit(token);
            await asSawyer.rest.issues.createComment({ owner, repo, issue_number: pull_number, body: '@codex review' });
            core.notice(`Requested Codex review: ${reviewable.length} of ${files.length} changed files are reviewable.`);
