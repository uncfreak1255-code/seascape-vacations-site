name: PR Check
on:
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: 'npm'
      - run: npm ci
      - run: npm run audit:deps --if-present
      - run: npm run build --if-present
      - run: npm test --if-present
      - run: npm run perf:budget:check --if-present
