name: Performance Budget

on:
  # No paths filter: this job is a required status check on main, and a
  # required check that never reports blocks the PR (adversarial review of
  # #617, 2026-09-24). Docs-only PRs report this check without Lighthouse.
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

concurrency:
  group: performance-budget-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  performance-budget:
    name: performance-budget
    # Hosted Linux for every event. Lighthouse needs no Mac pixels, hosted
    # compute is free on this public repository, and keeping this job off the
    # Mac leaves that single runner to the visual gate instead of queueing
    # the two behind each other.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine performance scope
        id: performance_scope
        run: node scripts/perf/performance-scope.js

      - name: Set up Node.js
        if: steps.performance_scope.outputs.run_lighthouse == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        if: steps.performance_scope.outputs.run_lighthouse == 'true'
        run: npm ci

      - name: Build production site
        if: steps.performance_scope.outputs.run_lighthouse == 'true'
        run: node scripts/enforcement/build-site.js

      - name: Check performance budgets
        if: steps.performance_scope.outputs.run_lighthouse == 'true'
        run: npx --no-install lhci autorun --config=./lighthouserc.js

      - name: Check byte-size ratchet
        if: steps.performance_scope.outputs.run_lighthouse == 'true'
        run: node scripts/perf/perf-ratchet.js

      - name: Upload Lighthouse reports
        if: always() && steps.performance_scope.outputs.run_lighthouse == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          # The reports live in a dot-directory; without this the action
          # uploads nothing and logs "No files were found" (PR #617 run 1).
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
