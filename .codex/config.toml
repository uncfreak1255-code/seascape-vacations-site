tool_timeout_sec = 60
default_tools_approval_mode = "prompt"
enabled_tools = [
  "whoami",
  "list_projects",
  "list_saved_keywords",
  "get_rank_tracker",
  "get_search_console_performance",
  "inspect_urls",
]

