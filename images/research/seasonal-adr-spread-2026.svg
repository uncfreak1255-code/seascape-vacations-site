<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Seasonal Gulf Coast vacation rental ADR spread</title>
  <desc id="desc">Spring averages 686 dollars per night, winter 680, summer 623, and fall 499.</desc>
  <rect width="1200" height="720" fill="#FAF7EE"/>
  <rect x="40" y="40" width="1120" height="640" rx="32" fill="#F5EED6" stroke="#D9CFB2"/>
  <text x="86" y="112" fill="#5F8A8B" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">SEASONAL ADR</text>
  <text x="86" y="174" fill="#3D5C5D" font-family="Playfair Display, Georgia, serif" font-size="54" font-weight="500">Fall is the price break.</text>
  <text x="86" y="222" fill="#595959" font-family="Poppins, Arial, sans-serif" font-size="24">Average nightly rate by season in the booking-trends dataset.</text>
  <g transform="translate(114 292)">
    <g transform="translate(0 0)">
      <rect x="0" y="15" width="210" height="290" rx="24" fill="#3D5C5D"/>
      <text x="34" y="70" fill="#E8D5A3" font-family="Playfair Display, Georgia, serif" font-size="54" font-weight="700">$686</text>
      <text x="34" y="112" fill="#FFFFFF" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="700">Spring</text>
      <text x="34" y="260" fill="#DDEAEA" font-family="Poppins, Arial, sans-serif" font-size="18">Peak rate</text>
    </g>
    <g transform="translate(254 3)">
      <rect x="0" y="15" width="210" height="287" rx="24" fill="#5F8A8B"/>
      <text x="34" y="70" fill="#E8D5A3" font-family="Playfair Display, Georgia, serif" font-size="54" font-weight="700">$680</text>
      <text x="34" y="112" fill="#FFFFFF" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="700">Winter</text>
      <text x="34" y="257" fill="#DDEAEA" font-family="Poppins, Arial, sans-serif" font-size="18">Near peak</text>
    </g>
    <g transform="translate(508 27)">
      <rect x="0" y="15" width="210" height="263" rx="24" fill="#7BA3A4"/>
      <text x="34" y="70" fill="#2D4647" font-family="Playfair Display, Georgia, serif" font-size="54" font-weight="700">$623</text>
      <text x="34" y="112" fill="#2D4647" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="700">Summer</text>
      <text x="34" y="233" fill="#2D4647" font-family="Poppins, Arial, sans-serif" font-size="18">-9% vs spring</text>
    </g>
    <g transform="translate(762 106)">
      <rect x="0" y="15" width="210" height="184" rx="24" fill="#C9A962"/>
      <text x="34" y="70" fill="#2A2014" font-family="Playfair Display, Georgia, serif" font-size="54" font-weight="700">$499</text>
      <text x="34" y="112" fill="#2A2014" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="700">Fall</text>
      <text x="34" y="154" fill="#2A2014" font-family="Poppins, Arial, sans-serif" font-size="18">-27% vs spring</text>
    </g>
  </g>
  <text x="86" y="642" fill="#5F8A8B" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.5">SOURCE: BOOKING TRENDS REPORT. 545 CONFIRMED BOOKINGS. COLLECTED ADR, NOT A QUOTE.</text>
</svg>
