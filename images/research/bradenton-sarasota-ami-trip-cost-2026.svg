<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Bradenton vs Sarasota vs Anna Maria Island lodging cost comparison</title>
  <desc id="desc">Average nightly lodging rates in the Seascape cost index are 248 dollars in Bradenton, 340 dollars in Sarasota, and 783 dollars on Anna Maria Island.</desc>
  <rect width="960" height="540" fill="#FAF7EE"/>
  <text x="60" y="74" font-family="Georgia, serif" font-size="34" fill="#2D4647">AMI Carries the Lodging Premium</text>
  <text x="60" y="108" font-family="Arial, sans-serif" font-size="17" fill="#595959">Average nightly lodging cost used in the Gulf Coast vacation cost index</text>
  <rect x="80" y="170" width="242" height="230" rx="18" fill="#FFFFFF" stroke="#EBE4CC"/>
  <rect x="359" y="140" width="242" height="260" rx="18" fill="#FFFFFF" stroke="#EBE4CC"/>
  <rect x="638" y="92" width="242" height="308" rx="18" fill="#3D5C5D"/>
  <text x="201" y="250" text-anchor="middle" font-family="Georgia, serif" font-size="48" fill="#2D4647">$248</text>
  <text x="480" y="235" text-anchor="middle" font-family="Georgia, serif" font-size="48" fill="#2D4647">$340</text>
  <text x="759" y="220" text-anchor="middle" font-family="Georgia, serif" font-size="52" fill="#FFFFFF">$783</text>
  <text x="201" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#5F8A8B">Bradenton</text>
  <text x="480" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#5F8A8B">Sarasota</text>
  <text x="759" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#E8D5A3">Anna Maria Island</text>
  <text x="201" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#595959">Mainland value base</text>
  <text x="480" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#595959">City/coastal mix</text>
  <text x="759" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#FFFFFF">Island scarcity premium</text>
  <text x="60" y="512" font-family="Arial, sans-serif" font-size="14" fill="#595959">Source: Seascape Vacations 2026 Gulf Coast vacation cost index; lodging figures are area averages used in the index.</text>
</svg>
