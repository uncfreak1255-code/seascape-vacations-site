<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Bradenton vs Sarasota vs Anna Maria Island trip cost lodging comparison</title>
  <desc id="desc">Average lodging inputs are 248 dollars per night in Bradenton, 340 in Sarasota, and 783 on Anna Maria Island.</desc>
  <rect width="1200" height="720" fill="#FAF7EE"/>
  <rect x="40" y="40" width="1120" height="640" rx="32" fill="#F5EED6" stroke="#D9CFB2"/>
  <text x="86" y="112" fill="#5F8A8B" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">TRIP COST</text>
  <text x="86" y="174" fill="#3D5C5D" font-family="Playfair Display, Georgia, serif" font-size="54" font-weight="500">The cost gap is mostly lodging.</text>
  <text x="86" y="222" fill="#595959" font-family="Poppins, Arial, sans-serif" font-size="24">Average nightly lodging input used in the 2026 cost index.</text>
  <g transform="translate(92 290)">
    <rect x="0" y="0" width="310" height="268" rx="28" fill="#FFFFFF" stroke="#D9CFB2"/>
    <text x="28" y="52" fill="#5F8A8B" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">BRADENTON</text>
    <text x="28" y="132" fill="#3D5C5D" font-family="Playfair Display, Georgia, serif" font-size="76" font-weight="700">$248</text>
    <text x="28" y="174" fill="#595959" font-family="Poppins, Arial, sans-serif" font-size="22">per night</text>
    <text x="28" y="222" fill="#595959" font-family="Poppins, Arial, sans-serif" font-size="19">Lower-cost home base.</text>
  </g>
  <g transform="translate(445 290)">
    <rect x="0" y="0" width="310" height="268" rx="28" fill="#FFFFFF" stroke="#D9CFB2"/>
    <text x="28" y="52" fill="#5F8A8B" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">SARASOTA</text>
    <text x="28" y="132" fill="#3D5C5D" font-family="Playfair Display, Georgia, serif" font-size="76" font-weight="700">$340</text>
    <text x="28" y="174" fill="#595959" font-family="Poppins, Arial, sans-serif" font-size="22">per night</text>
    <text x="28" y="222" fill="#595959" font-family="Poppins, Arial, sans-serif" font-size="19">Middle of the cost curve.</text>
  </g>
  <g transform="translate(798 290)">
    <rect x="0" y="0" width="310" height="268" rx="28" fill="#2D4647"/>
    <text x="28" y="52" fill="#E8D5A3" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">ANNA MARIA ISLAND</text>
    <text x="28" y="132" fill="#E8D5A3" font-family="Playfair Display, Georgia, serif" font-size="76" font-weight="700">$783</text>
    <text x="28" y="174" fill="#DDEAEA" font-family="Poppins, Arial, sans-serif" font-size="22">per night</text>
    <text x="28" y="222" fill="#DDEAEA" font-family="Poppins, Arial, sans-serif" font-size="19">Island-scarcity premium.</text>
  </g>
  <path d="M248 592 H953" stroke="#C9A962" stroke-width="10" stroke-linecap="round"/>
  <text x="408" y="632" fill="#3D5C5D" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="700">AMI lodging input is more than 3x Bradenton.</text>
  <text x="86" y="672" fill="#5F8A8B" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.5">SOURCE: 2026 GULF COAST VACATION COST INDEX. PLANNING COMPARISON, NOT A QUOTE.</text>
</svg>
