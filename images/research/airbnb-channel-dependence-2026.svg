<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Airbnb channel dependence in Seascape's 2026 Gulf Coast booking research</title>
  <desc id="desc">Airbnb accounts for 87 percent of analyzed bookings, with smaller shares from VRBO and HomeAway, direct bookings, Booking.com, and Google.</desc>
  <rect width="1200" height="720" fill="#FAF7EE"/>
  <rect x="40" y="40" width="1120" height="640" rx="32" fill="#F5EED6" stroke="#D9CFB2"/>
  <text x="86" y="112" fill="#5F8A8B" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">CHANNEL MIX</text>
  <text x="86" y="174" fill="#3D5C5D" font-family="Playfair Display, Georgia, serif" font-size="54" font-weight="500">Airbnb carries most of the booking load.</text>
  <text x="86" y="222" fill="#595959" font-family="Poppins, Arial, sans-serif" font-size="24">Share of 545 confirmed Gulf Coast bookings, June 2022-March 2026.</text>
  <g transform="translate(86 286)">
    <text x="0" y="36" fill="#3A3A3A" font-family="Poppins, Arial, sans-serif" font-size="24" font-weight="700">Airbnb</text>
    <rect x="230" y="10" width="760" height="38" rx="19" fill="#EBE4CC"/>
    <rect x="230" y="10" width="661" height="38" rx="19" fill="#3D5C5D"/>
    <text x="1012" y="37" fill="#3D5C5D" font-family="Playfair Display, Georgia, serif" font-size="34" font-weight="700">87.0%</text>
    <text x="0" y="112" fill="#3A3A3A" font-family="Poppins, Arial, sans-serif" font-size="24" font-weight="700">VRBO / HomeAway</text>
    <rect x="230" y="86" width="760" height="38" rx="19" fill="#EBE4CC"/>
    <rect x="230" y="86" width="70" height="38" rx="19" fill="#7BA3A4"/>
    <text x="1012" y="113" fill="#3D5C5D" font-family="Playfair Display, Georgia, serif" font-size="34" font-weight="700">9.2%</text>
    <text x="0" y="188" fill="#3A3A3A" font-family="Poppins, Arial, sans-serif" font-size="24" font-weight="700">Direct</text>
    <rect x="230" y="162" width="760" height="38" rx="19" fill="#EBE4CC"/>
    <rect x="230" y="162" width="21" height="38" rx="19" fill="#C9A962"/>
    <text x="1012" y="189" fill="#3D5C5D" font-family="Playfair Display, Georgia, serif" font-size="34" font-weight="700">2.8%</text>
    <text x="0" y="264" fill="#3A3A3A" font-family="Poppins, Arial, sans-serif" font-size="24" font-weight="700">Booking.com</text>
    <rect x="230" y="238" width="760" height="38" rx="19" fill="#EBE4CC"/>
    <rect x="230" y="238" width="8" height="38" rx="4" fill="#B8943A"/>
    <text x="1012" y="265" fill="#3D5C5D" font-family="Playfair Display, Georgia, serif" font-size="34" font-weight="700">1.1%</text>
    <text x="0" y="340" fill="#3A3A3A" font-family="Poppins, Arial, sans-serif" font-size="24" font-weight="700">Google</text>
    <rect x="230" y="314" width="760" height="38" rx="19" fill="#EBE4CC"/>
    <rect x="230" y="314" width="3" height="38" rx="2" fill="#B8943A"/>
    <text x="1012" y="341" fill="#3D5C5D" font-family="Playfair Display, Georgia, serif" font-size="34" font-weight="700">0.2%</text>
  </g>
  <text x="86" y="642" fill="#5F8A8B" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.5">SOURCE: BOOKING TRENDS REPORT. 545 CONFIRMED BOOKINGS. NOT A MARKET-WIDE SURVEY.</text>
</svg>
