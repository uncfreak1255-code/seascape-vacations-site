<!-- Sample: the owner evaluation form as it renders today (one screen). -->
<section class="owner-evaluation" id="evaluate">
  <h2>Get your free rental evaluation</h2>
  <form action="/.netlify/functions/owner-inquiry" method="post">
    <label>Full name <input name="name" required></label>
    <label>Email <input type="email" name="email" required></label>
    <label>Phone <input type="tel" name="phone" required></label>
    <label>Property address <input name="address" required></label>
    <label>Bedrooms
      <select name="bedrooms" required>
        <option value="">Select</option><option>1-2</option><option>3</option><option>4</option><option>5+</option>
      </select>
    </label>
    <label>Current manager <input name="current_manager" required></label>
    <label>Annual rental revenue <input name="annual_revenue" inputmode="numeric" required></label>
    <button type="submit">Submit</button>
  </form>
</section>
